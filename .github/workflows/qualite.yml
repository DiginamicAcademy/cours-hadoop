name: Qualité

# Vérifie le markdown du cours à chaque commit et publie un rapport.
#
# Deux sources de vérification :
#   1. markdownlint-cli2 — les règles mécaniques du markdown ;
#   2. .github/scripts/qualite.py — les règles maison (structure, liens, images,
#      typo française, acronymes, fuite Bloom, secrets, fuite de conception).
#
# Le rapport s'affiche dans le résumé du run (onglet Summary) et, sur une pull
# request, en commentaire. Les erreurs bloquent le run ; les avertissements
# documentent. Le rapport complet est téléchargeable en artefact.
#
# Règles maison : references/analyses/checklist-markdown.md (workspace Yuto).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  qualite:
    name: Vérifier le markdown
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # markdownlint-cli2 lit .markdownlint.json à la racine si présent.
      - name: Linter le markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "#node_modules" || true

      - name: Vérifications maison
        id: maison
        run: |
          set +e
          python3 .github/scripts/qualite.py . > rapport-qualite.md
          code=$?
          set -e
          cat rapport-qualite.md
          exit $code

      - name: Publier le rapport dans le résumé du run
        if: always()
        run: cat rapport-qualite.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commenter la pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rapport = fs.readFileSync('rapport-qualite.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## Rapport qualité markdown\n\n' + rapport,
            });

      - name: Archiver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-qualite
          path: rapport-qualite.md
