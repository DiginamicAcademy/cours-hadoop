<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <defs>
    <marker id="hp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Un fichier = des blocs ; chaque bloc = N copies</text>

  <!-- Bandeau réplication -->
  <rect x="700" y="52" width="220" height="78" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="716" y="74" font-size="12" font-weight="600" fill="#9a3412">Défaut HDFS : 3 copies / bloc</text>
  <text x="716" y="94" font-size="12" fill="#9a3412">Cluster du cours : 1 copie</text>
  <text x="716" y="114" font-size="11" fill="#9a3412">dfs.replication=1 (hdfs-site.xml)</text>

  <!-- Fichier découpé -->
  <text x="60" y="72" font-size="14" fill="#475569">fichier <tspan font-weight="600">ventes.csv</tspan> — 400 Mio</text>

  <g stroke="#334155" stroke-width="1.5">
    <rect x="60" y="82" width="130" height="54" rx="6" fill="#dbeafe"/>
    <rect x="190" y="82" width="130" height="54" fill="#dcfce7"/>
    <rect x="320" y="82" width="130" height="54" fill="#fef3c7"/>
    <rect x="450" y="82" width="90" height="54" rx="6" fill="#fce7f3"/>
  </g>
  <g text-anchor="middle" fill="#0f172a">
    <text x="125" y="107" font-size="15" font-weight="600">B1</text>
    <text x="125" y="125" font-size="11" fill="#475569">128 Mio</text>
    <text x="255" y="107" font-size="15" font-weight="600">B2</text>
    <text x="255" y="125" font-size="11" fill="#475569">128 Mio</text>
    <text x="385" y="107" font-size="15" font-weight="600">B3</text>
    <text x="385" y="125" font-size="11" fill="#475569">128 Mio</text>
    <text x="495" y="107" font-size="15" font-weight="600">B4</text>
    <text x="495" y="125" font-size="11" fill="#475569">16 Mio</text>
  </g>

  <line x1="300" y1="136" x2="300" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#hp-arr)"/>
  <text x="312" y="166" font-size="12" fill="#475569">découpage en blocs (seul le dernier peut être partiel)</text>

  <!-- DataNode 1 -->
  <rect x="110" y="194" width="320" height="138" rx="12" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2"/>
  <text x="130" y="220" font-size="14" font-weight="600" fill="#0c4a6e">DataNode 1 — slave1</text>
  <rect x="140" y="238" width="110" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">B1</text>
  <text x="195" y="277" text-anchor="middle" font-size="11" fill="#1e40af">128 Mio</text>
  <rect x="270" y="238" width="110" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="325" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">B3</text>
  <text x="325" y="277" text-anchor="middle" font-size="11" fill="#92400e">128 Mio</text>
  <text x="130" y="316" font-size="11" fill="#475569">aucun autre bloc : réplication 1</text>

  <!-- DataNode 2 -->
  <rect x="530" y="194" width="320" height="138" rx="12" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2"/>
  <text x="550" y="220" font-size="14" font-weight="600" fill="#0c4a6e">DataNode 2 — slave2</text>
  <rect x="560" y="238" width="110" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">B2</text>
  <text x="615" y="277" text-anchor="middle" font-size="11" fill="#166534">128 Mio</text>
  <rect x="690" y="238" width="110" height="50" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="745" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#9d174d">B4</text>
  <text x="745" y="277" text-anchor="middle" font-size="11" fill="#9d174d">16 Mio</text>
  <text x="550" y="316" font-size="11" fill="#475569">les blocs sont répartis entre les nœuds</text>

  <!-- Légende et notes -->
  <line x1="60" y1="352" x2="900" y2="352" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="60" y="368" width="250" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="76" y="390" font-size="13" font-weight="600" fill="#0f172a">Ce qui est répliqué</text>
  <text x="76" y="410" font-size="12" fill="#334155">les blocs, pas les fichiers.</text>
  <text x="76" y="428" font-size="12" fill="#334155">Les répertoires n'existent</text>
  <text x="76" y="443" font-size="12" fill="#334155">que dans l'index du NameNode.</text>

  <rect x="330" y="368" width="270" height="76" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="346" y="390" font-size="13" font-weight="600" fill="#991b1b">Panne d'un DataNode</text>
  <text x="346" y="410" font-size="12" fill="#7f1d1d">Avec réplication 1, le bloc B1</text>
  <text x="346" y="428" font-size="12" fill="#7f1d1d">est perdu. Avec réplication 3,</text>
  <text x="346" y="443" font-size="12" fill="#7f1d1d">le NameNode recrée une copie.</text>

  <rect x="620" y="368" width="300" height="76" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="636" y="390" font-size="13" font-weight="600" fill="#1e3a8a">Bloc ≠ split MapReduce</text>
  <text x="636" y="410" font-size="12" fill="#1e40af">Le CSV Spotify tient dans 1 bloc</text>
  <text x="636" y="428" font-size="12" fill="#1e40af">et a donné 2 mappers : le split</text>
  <text x="636" y="443" font-size="12" fill="#1e40af">est une décision de MapReduce (04).</text>
</svg>
