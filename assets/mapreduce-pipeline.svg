<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, system-ui, Arial, sans-serif">

  <defs>
    <marker id="mpa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- bande de fond -->
  <rect x="40" y="30" width="880" height="340" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- 3 lignes : bloc → split → MAP -->
  <rect x="60" y="115" width="88" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="104" y="145" text-anchor="middle" font-size="14" fill="#92400e">bloc 1</text>
  <line x1="148" y1="139" x2="168" y2="139" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <rect x="170" y="115" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="214" y="145" text-anchor="middle" font-size="14" fill="#1e40af">split 1</text>
  <line x1="258" y1="139" x2="288" y2="139" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <rect x="290" y="115" width="108" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="344" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">MAP 1</text>

  <rect x="60" y="180" width="88" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="104" y="212" text-anchor="middle" font-size="14" fill="#92400e">bloc 2</text>
  <line x1="148" y1="204" x2="168" y2="204" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <rect x="170" y="180" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="214" y="212" text-anchor="middle" font-size="14" fill="#1e40af">split 2</text>
  <line x1="258" y1="204" x2="288" y2="204" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <rect x="290" y="180" width="108" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="344" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">MAP 2</text>

  <rect x="60" y="245" width="88" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="104" y="277" text-anchor="middle" font-size="14" fill="#92400e">bloc n</text>
  <line x1="148" y1="269" x2="168" y2="269" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <rect x="170" y="245" width="88" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="214" y="277" text-anchor="middle" font-size="14" fill="#1e40af">split n</text>
  <line x1="258" y1="269" x2="288" y2="269" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <rect x="290" y="245" width="108" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="344" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">MAP n</text>

  <!-- bus de regroupement -->
  <line x1="398" y1="139" x2="428" y2="139" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <line x1="398" y1="204" x2="428" y2="204" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <line x1="398" y1="269" x2="428" y2="269" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <line x1="430" y1="139" x2="430" y2="269" stroke="#334155" stroke-width="2"/>
  <line x1="430" y1="204" x2="452" y2="204" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>

  <!-- partition + shuffle + sort -->
  <rect x="455" y="149" width="200" height="110" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="555" y="177" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">PARTITION</text>
  <text x="555" y="199" text-anchor="middle" font-size="14" fill="#334155">+ shuffle + sort</text>
  <text x="555" y="223" text-anchor="middle" font-size="12" fill="#64748b">clés groupées, triées</text>

  <!-- REDUCE -->
  <line x1="655" y1="204" x2="698" y2="204" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <rect x="700" y="159" width="110" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="755" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">REDUCE</text>
  <text x="755" y="210" text-anchor="middle" font-size="12" fill="#166534">agrège par clé</text>
  <text x="755" y="230" text-anchor="middle" font-size="12" fill="#166534">les valeurs</text>

  <!-- part-00000 -->
  <line x1="810" y1="204" x2="832" y2="204" stroke="#334155" stroke-width="2" marker-end="url(#mpa)"/>
  <rect x="835" y="182" width="95" height="44" rx="22" fill="#0f172a"/>
  <text x="882" y="210" text-anchor="middle" font-size="13" fill="#e2e8f0">part-00000</text>

  <!-- orchestration YARN -->
  <rect x="60" y="330" width="840" height="30" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="350" text-anchor="middle" font-size="13" fill="#334155">YARN alloue les conteneurs : l'ApplicationMaster y place mappers et reducers ; MapReduce gère splits et relances</text>

</svg>