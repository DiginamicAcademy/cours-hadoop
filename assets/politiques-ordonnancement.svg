<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Trois politiques d'allocation : elles ne changent pas le résultat, elles changent qui attend</text>

  <!-- FIFO -->
  <rect x="60" y="60" width="260" height="212" rx="12" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2"/>
  <text x="80" y="88" font-size="16" font-weight="600" fill="#0c4a6e">FIFO</text>
  <text x="80" y="112" font-size="12" fill="#334155">une seule file,</text>
  <text x="80" y="128" font-size="12" fill="#334155">premier arrivé, premier servi</text>
  <text x="80" y="158" font-size="12" fill="#166534">+ simple à comprendre</text>
  <text x="80" y="184" font-size="12" fill="#991b1b">- un gros job bloque</text>
  <text x="80" y="200" font-size="12" fill="#991b1b">  tous les suivants</text>
  <rect x="80" y="222" width="220" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="96" y="244" font-size="11" fill="#334155">job 1 ▸ job 2 ▸ job 3 attend</text>

  <!-- Capacity -->
  <rect x="350" y="60" width="260" height="212" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="88" font-size="16" font-weight="600" fill="#14532d">Capacity</text>
  <rect x="470" y="72" width="120" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="530" y="88" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">défaut Hadoop 3</text>
  <text x="370" y="112" font-size="12" fill="#334155">des files à capacité</text>
  <text x="370" y="128" font-size="12" fill="#334155">garantie, prêtée si inutilisée</text>
  <text x="370" y="158" font-size="12" fill="#166534">+ multi-tenant, cloisonné</text>
  <text x="370" y="184" font-size="12" fill="#991b1b">- configuration plus lourde</text>
  <rect x="370" y="222" width="220" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="386" y="244" font-size="11" fill="#334155">file A ▸▸ · file B ▸ · file C ▸▸</text>

  <!-- Fair -->
  <rect x="640" y="60" width="260" height="212" rx="12" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
  <text x="660" y="88" font-size="16" font-weight="600" fill="#92400e">Fair</text>
  <text x="660" y="112" font-size="12" fill="#334155">part équitable des</text>
  <text x="660" y="128" font-size="12" fill="#334155">ressources, ajustée en continu</text>
  <text x="660" y="158" font-size="12" fill="#166534">+ bon pour les charges</text>
  <text x="660" y="174" font-size="12" fill="#166534">  mélangées</text>
  <text x="660" y="200" font-size="12" fill="#991b1b">- moins prévisible pour</text>
  <text x="660" y="216" font-size="12" fill="#991b1b">  les gros batchs</text>
  <rect x="660" y="222" width="220" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="676" y="244" font-size="11" fill="#334155">job 1 ▸ · job 2 ▸ · job 3 ▸</text>

  <line x1="60" y1="292" x2="900" y2="292" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="60" y="308" width="270" height="112" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="76" y="330" font-size="13" font-weight="600" fill="#991b1b">Le symptôme que vous verrez</text>
  <text x="76" y="350" font-size="12" fill="#7f1d1d">Un job reste ACCEPTED alors que</text>
  <text x="76" y="366" font-size="12" fill="#7f1d1d">le cluster a de la place : il attend</text>
  <text x="76" y="382" font-size="12" fill="#7f1d1d">son tour dans une file, il n'est pas</text>
  <text x="76" y="398" font-size="12" fill="#7f1d1d">en panne.</text>

  <rect x="350" y="308" width="270" height="112" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="366" y="330" font-size="13" font-weight="600" fill="#1e3a8a">Où ça se règle</text>
  <text x="366" y="350" font-size="12" fill="#1e40af">etc/hadoop/yarn-site.xml,</text>
  <text x="366" y="366" font-size="12" fill="#1e40af">propriété</text>
  <text x="366" y="382" font-size="12" font-weight="600" fill="#1e40af">yarn.resourcemanager.</text>
  <text x="366" y="398" font-size="12" font-weight="600" fill="#1e40af">scheduler.class</text>

  <rect x="640" y="308" width="260" height="112" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="656" y="330" font-size="13" font-weight="600" fill="#0f172a">Ici, l'effet reste modeste</text>
  <text x="656" y="350" font-size="12" fill="#334155">Trois nœuds, rarement deux</text>
  <text x="656" y="366" font-size="12" fill="#334155">jobs en concurrence : la politique</text>
  <text x="656" y="382" font-size="12" fill="#334155">compte surtout pour comprendre</text>
  <text x="656" y="398" font-size="12" fill="#334155">un job qui attend.</text>
</svg>
