<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <defs>
    <marker id="so-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Grossir ou se multiplier ?</text>

  <!-- scale-up -->
  <g>
    <rect x="40" y="52" width="410" height="250" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="60" y="78" font-size="14" font-weight="600" fill="#7f1d1d">scale-up — grossir la machine</text>

    <rect x="70" y="180" width="60" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="100" y="210" text-anchor="middle" font-size="11" fill="#7f1d1d">S</text>

    <line x1="140" y1="205" x2="175" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#so-arr)"/>

    <rect x="185" y="158" width="84" height="72" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="227" y="200" text-anchor="middle" font-size="11" fill="#7f1d1d">S +</text>

    <line x1="278" y1="205" x2="313" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#so-arr)"/>

    <rect x="323" y="130" width="110" height="100" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="378" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">S ++</text>
    <text x="378" y="196" text-anchor="middle" font-size="11" fill="#b91c1c">⚠ plafond</text>

    <text x="60" y="262" font-size="12" fill="#7f1d1d">Le prix monte plus vite que la capacité ;</text>
    <text x="60" y="282" font-size="12" font-weight="600" fill="#b91c1c">la machine a des limites physiques</text>
  </g>

  <!-- scale-out -->
  <g>
    <rect x="510" y="52" width="410" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="530" y="78" font-size="14" font-weight="600" fill="#14532d">scale-out — ajouter des machines</text>

    <g fill="#ffffff" stroke="#16a34a" stroke-width="1.5">
      <rect x="540" y="110" width="70" height="56" rx="6"/>
      <rect x="622" y="110" width="70" height="56" rx="6"/>
      <rect x="704" y="110" width="70" height="56" rx="6"/>
      <rect x="540" y="180" width="70" height="56" rx="6"/>
      <rect x="622" y="180" width="70" height="56" rx="6"/>
      <rect x="704" y="180" width="70" height="56" rx="6"/>
    </g>
    <g font-size="11" fill="#14532d" text-anchor="middle">
      <text x="575" y="142">M</text><text x="657" y="142">M</text><text x="739" y="142">M</text>
      <text x="575" y="212">M</text><text x="657" y="212">M</text><text x="739" y="212">M</text>
    </g>

    <rect x="786" y="110" width="70" height="56" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="821" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">+ M</text>
    <rect x="786" y="180" width="70" height="56" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="821" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">+ M</text>

    <text x="530" y="262" font-size="12" fill="#14532d">Capacité et calcul s'additionnent, coût ≈ linéaire ;</text>
    <text x="530" y="282" font-size="12" font-weight="600" fill="#15803d">pas de plafond unique, on ajoute un nœud</text>
  </g>

  <text x="480" y="344" text-anchor="middle" font-size="12" fill="#475569">Hadoop choisit le scale-out : des machines standard, nombreuses et bon marché</text>
</svg>
