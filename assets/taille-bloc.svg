<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <defs>
    <marker id="tb-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">La taille d'un bloc est un compromis, pas un réglage gratuit</text>

  <!-- Axe -->
  <line x1="110" y1="104" x2="850" y2="104" stroke="#334155" stroke-width="2" marker-start="url(#tb-arr)" marker-end="url(#tb-arr)"/>
  <text x="110" y="86" font-size="13" font-weight="600" fill="#0f172a">blocs petits</text>
  <text x="850" y="86" text-anchor="end" font-size="13" font-weight="600" fill="#0f172a">blocs gros</text>

  <rect x="424" y="82" width="112" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="480" y="110" text-anchor="middle" font-size="15" font-weight="600" fill="#9a3412">128 Mio</text>
  <text x="480" y="150" text-anchor="middle" font-size="11" fill="#475569">dfs.blocksize — le défaut d'Hadoop 3, dérogeable à la création du fichier</text>

  <!-- Petits blocs -->
  <rect x="60" y="172" width="400" height="150" rx="12" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2"/>
  <text x="80" y="198" font-size="15" font-weight="600" fill="#0c4a6e">Petits blocs</text>
  <text x="80" y="224" font-size="12" fill="#166534">↑ parallélisme : un fichier tient dans</text>
  <text x="80" y="240" font-size="12" fill="#166534">plus de blocs, donc plus de mappers</text>
  <text x="80" y="268" font-size="12" fill="#991b1b">↑ surcoût de métadonnées : chaque</text>
  <text x="80" y="284" font-size="12" fill="#991b1b">bloc est un objet en RAM du NameNode</text>
  <text x="80" y="308" font-size="12" fill="#991b1b">↑ plus de recherches disque à l'ouverture</text>

  <!-- Gros blocs -->
  <rect x="500" y="172" width="400" height="150" rx="12" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="198" font-size="15" font-weight="600" fill="#92400e">Gros blocs</text>
  <text x="520" y="224" font-size="12" fill="#166534">↓ surcoût de métadonnées : moins</text>
  <text x="520" y="240" font-size="12" fill="#166534">d'objets à tenir en RAM, moins de seeks</text>
  <text x="520" y="268" font-size="12" fill="#991b1b">↓ parallélisme : un fichier peut tenir</text>
  <text x="520" y="284" font-size="12" fill="#991b1b">dans un seul bloc, donc un seul mapper</text>
  <text x="520" y="308" font-size="12" fill="#991b1b">↓ un nœud travaille, les autres regardent</text>

  <line x1="60" y1="340" x2="900" y2="340" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="60" y="356" width="840" height="70" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="76" y="378" font-size="13" font-weight="600" fill="#991b1b">Un bloc partiel ne gaspille pas d'espace — et ce n'est pas pour ça qu'on raccourcit les blocs</text>
  <text x="76" y="398" font-size="12" fill="#7f1d1d">HDFS ne préalloue rien : un fichier de 1 Mio occupe 1 Mio sur le disque, pas 128 Mio. Le surcoût des petits fichiers</text>
  <text x="76" y="414" font-size="12" fill="#7f1d1d">se paie en mémoire du NameNode (≈ 150 o par objet), pas en place — diminuer la taille des blocs ne le réduit pas.</text>
</svg>
